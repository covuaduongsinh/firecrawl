name: Ingestion UI

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/ui/ingestion-ui/**
      - .github/workflows/ingestion-ui.yml
  push:
    branches:
      - main
    paths:
      - apps/ui/ingestion-ui/**
      - .github/workflows/ingestion-ui.yml

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/ui/ingestion-ui
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ./apps/ui/ingestion-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t ingestion-ui:ci apps/ui/ingestion-ui
      - name: Smoke test
        run: |
          docker run -d --name ui -p 3006:3006 -e UI_BASIC_AUTH=ci:secret ingestion-ui:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3006/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3006/)" = "401"
          curl -sf -u ci:secret http://127.0.0.1:3006/ | grep -q 'firecrawl-bridge-token'
          docker rm -f ui
